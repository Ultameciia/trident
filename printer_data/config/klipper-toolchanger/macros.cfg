[gcode_macro prime_active_tool]
gcode:
    {% set tool = params.T|int %}
    RESPOND MSG="Tool: {tool}"
    # Print the perimeter and left side with T0
    {% if tool == 0 %}
      _PRIME_LEFT
    {% else %}
      _PRIME_RIGHT
    {% endif %}

[gcode_macro _prime_left]
gcode:
  G0 X135 Y15 F10000                           # Go to starting point
  G0 Z0.4                                               # Raise Z to 0.4
  G91                                                   # Incremental positioning 
  G1 X75 E20 F1000                                     # Primeline
  G90                                                   # Absolute position

[gcode_macro _prime_right]
gcode:
  G0 X135 Y17 F10000                           # Go to starting point
  G0 Z0.4                                               # Raise Z to 0.4
  G91                                                   # Incremental positioning 
  G1 X75 E20 F1000                                     # Primeline
  G90                                                   # Absolute position

[gcode_macro _CHANGE_TOOL]
description: Changes tools, updates offsets and transfers fan control to the next tool head.
  If tool head LEDs are defined, will set READY, BUSY, or PRINTING.
  Usage: _CHANGE_TOOL T={tool_number}
gcode:
  {% set tool_number = params.T|int %}
  {% set svf = printer.save_variables.variables %}
  {% set modified_z = 0.0 %}
  {% set last_tool = printer.toolchanger.tool_number|int %}
  {% if last_tool|int >= 0 %}
    # Grab the current tool number so we can remove any z offset that is present
    {% set z_offset_val = svf[ 't' + printer.toolchanger.tool_number|string + '_offset_z'] %}
    # Subtract the tool z_offset from the homing_origin, the remainder is any tweaked z offset
    {% set modified_z = printer.gcode_move.homing_origin.z|float|round(3) - z_offset_val|float|round(3) %}
    # Grab the current print fan speed
    {% set active_fan = "fan_generic part_fan_t" + printer.toolchanger.tool_number|string %}
    {% set fan_speed = printer[active_fan].speed|float|round(2) %}
    # Shutdown the active part cooling fan
    SET_FAN_SPEED FAN="part_fan_t{printer.toolchanger.tool_number|string}" SPEED=0
    # Clear the offsets set by macros
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=1
    # Update toolhead lights if applicable
    {% if printer["gcode_macro _sb_vars"] is defined %}
      STATUS_READY
    {% endif %}
  {% endif %}
  # Activate the selected tool
  SELECT_TOOL T={tool_number}
  # Apply the macro offsets, including modified z settings
  SET_GCODE_OFFSET X={svf[ 't' + tool_number|string + '_offset_x']|float|round(3)} Y={svf[ 't' + tool_number|string + '_offset_y']|float|round(3)} Z={svf[ 't' + tool_number|string + '_offset_z']|float + modified_z|float|round(3)} MOVE=1
  # Transfer the print fan speed to the active tool head
  {% if last_tool|int >= 0 %}
    SET_FAN_SPEED FAN="part_fan_t{tool_number}" SPEED={fan_speed}
  {% endif %}
  # Update toolhead lights if applicable
  {% if printer["gcode_macro _sb_vars"] is defined %}
    {% if printer.idle_timeout.state != "Printing" %}
      STATUS_BUSY
    {% else %}
      STATUS_PRINTING
    {% endif %}
  {% endif %}
  # Update the current tool variable in the save file
  SAVE_VARIABLE VARIABLE=current_tool VALUE={tool_number}

[gcode_macro _CRASH_DETECTION]
variable_tool_change: False
gcode:
    {% set active_tool = printer.toolchanger.tool_number|int %}
    {% set calling_tool = params.TOOL|int %}
    {% if calling_tool == active_tool and tool_change == False %}
        RESPOND TYPE=error MSG='Tool not detected, expected {printer.toolchanger.tool_number}. Pausing the print.'
        PAUSE
    {% endif %} 

[gcode_macro SMART_HOMING]
description: Homes and levels gantry if not already done.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    # Adjust QGL if not done
    {% if printer.quad_gantry_level is defined %}
      {% if printer.quad_gantry_level.applied == False %}
        QUAD_GANTRY_LEVEL
        G28 Z
      {% else %}
        RESPOND MSG="Printer gantry already adjusted, skipping QGL."
      {% endif %}
    {% endif %}


# Revised Macros for Cartographer Z-Offset Calibration
#
# These macros automate the process of finding and saving the Z-offset for each tool
# using the Cartographer probe, writing the results directly to the
# offset_save_file.cfg.
################################################################################

[gcode_macro CARTO_CALIBRATE_TOOL_Z]
description: Macro to calibrate Z offsets for all tools using the cartographer touch probe.
variable_t0_z_ref: 0.0 
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' %}
        RESPOND TYPE=error MSG="Please home the printer before running this macro."
    {% else %}
        RESPOND TYPE=command MSG="Starting Z offset calibration for all tools."
        _CARTO_CALIBRATE_TOOL_OFFSET
        _CARTO_CALIBRATE_TOOL_EVALUATE
        RESPOND TYPE=command MSG="Calibration complete. Run SAVE_CONFIG to commit values."
    {% endif %}

[gcode_macro _MOVE_TO_CENTER]
description: Moves the toolhead to the center of the bed at a safe Z height.
gcode:    
    G90                  ; Absolute positioning
    G0 Z10 F600          ; Move to safe Z height
    G0 X175 Y175 F6000   ; Move to bed center
    G0 Z10 F600          ; Move back to a safe height (for safety)

[gcode_macro _CARTO_CALIBRATE_TOOL_OFFSET]
gcode:
    {% set tools = printer.toolchanger.tool_numbers %}
    {% set initial_tool_temps = {
        'T0': printer.extruder.target|float,
        'T1': printer.extruder1.target|float
    } %}
    
    RESPOND TYPE=command MSG="Calibrating Z offsets for tools: {tools}"
    
    {% for tool_num in tools %}
        RESPOND TYPE=command MSG="Starting calibration for tool T{tool_num}"
        
        {% set current_heater_name = "" %}
        {% if tool_num == 0 %}
            {% set current_heater_name = "extruder" %}
        {% elif tool_num == 1 %}
            {% set current_heater_name = "extruder1" %}
        {% endif %}
        
      
        SELECT_TOOL T={tool_num}
        M104 S140 
        _WAIT_FOR_TEMP_WITHIN_TOLERANCE HEATER={current_heater_name} TOLERANCE=5
        _MOVE_TO_CENTER
        
        CARTOGRAPHER_TOUCH_HOME
        
        {% set z_result = printer.cartographer.touch.last_z_result %}
        
        {% if z_result is not none %}
            
            {% if tool_num == 0 %}
                
                SET_GCODE_VARIABLE MACRO=CARTO_CALIBRATE_TOOL_Z VARIABLE=t0_z_ref VALUE={z_result}
                SAVE_VARIABLE VARIABLE='t0_offset_z' VALUE=0.0
                RESPOND TYPE=command MSG="T0 reference Z set to: {z_result|round(4)}. Offset saved as 0.0"
                
            {% else %}
            
                {% set z_reference = printer['gcode_macro CARTO_CALIBRATE_TOOL_Z'].t0_z_ref %}
                
                # Calculate the relative offset: T0_Z - Current_Tool_Z
                {% set z_offset = z_result - z_reference %}
                
                SAVE_VARIABLE VARIABLE={'t' + tool_num|string + '_offset_z'} VALUE={z_offset}
                RESPOND TYPE=command MSG="T{tool_num} probed Z: {z_result|round(4)}. Calculated relative offset: {z_offset|round(4)}"
            
            {% endif %}
            
        {% else %}
            RESPOND TYPE=command MSG="Touch failed for tool T{tool_num}"
        {% endif %}
        
        M104 S0
    {% endfor %}
  
    M109 S{initial_tool_temps.T0} T0
    M109 S{initial_tool_temps.T1} T1
    
[gcode_macro _CARTO_CALIBRATE_TOOL_EVALUATE]
gcode:
    {% set tools = printer.toolchanger.tool_numbers %}
    RESPOND TYPE=command MSG="--- Z-Offsets from Cartographer Saved ---"
    RESPOND TYPE=command MSG="The following values have been saved to offset_save_file.cfg:"
    RESPOND TYPE=command MSG="------------------------------------"
    {% for tool_num in tools %}
        {% set saved_offset = printer.save_variables.variables['t' ~ tool_num|string ~ '_offset_z']|float|round(4) %}
        RESPOND TYPE=command MSG="gcode_z_offset for tool T{tool_num}: {saved_offset}"
    {% endfor %}
    RESPOND TYPE=command MSG="------------------------------------"    




[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}

