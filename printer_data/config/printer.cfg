## Z0 Stepper - Front Left on MOTOR3_A
[stepper_z]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11

rotation_distance: 4
microsteps: 32
endstop_pin:probe:z_virtual_endstop
position_max: 250
position_min: -5
homing_speed: 8.0 
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PG10
interpolate: true
run_current: 0.8
sense_resistor: 0.110
#stealthchop_threshold: 0

##	Z1 Stepper - Rear  on Motor5 
[stepper_z1]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0

rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PB9
interpolate: true
run_current: 0.6
sense_resistor: 0.110
#stealthchop_threshold: 0

##	Z2 Stepper - Front Right on Motor6 
[stepper_z2]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6

rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PD5
interpolate: true
run_current: 0.6
sense_resistor: 0.110
#stealthchop_threshold: 0

