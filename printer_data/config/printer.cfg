[heater_bed]
##	SSR Pin - HE1
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PB1
max_power: 0.8
min_temp: 0
max_temp: 120


[heater_generic chamber]
heater_pin: !PA5
max_power: 1.0
sensor_type: Generic 3950
sensor_pin: PA7
min_temp: 0
max_temp: 130
#control: pid
#pid_kp: 0
#pid_ki: 0
#pid_kd: 0
gcode_id: C



[heater_fan chamberheater_fan]
pin: PA4
max_power: 1.0
heater: chamber
fan_speed: 1.0
heater_temp: 30

[gcode_macro M141]
gcode:
   SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S}

[gcode_macro M191]
gcode:
   SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S}
   TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={params.S}



